<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IntelligentX — Mental wellbeing landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDEEF5;
    --brand: #9fff00;
    --text-dark: #1a1a1a;
    --text-muted: #8e8e8e;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-display: 'Outfit', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }
  ::selection { background: var(--brand); color: #000; }

  /* ── Navbar ─────────────────────── */
  .navbar {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
    padding: 24px 0;
    background: linear-gradient(to bottom, rgba(241,241,241,0.8), transparent);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .nav-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 0 32px;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px;
    align-items: center;
  }
  .nav-brand { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; }
  .nav-brand svg { width: 28px; height: 28px; }
  .nav-brand span { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.03em; }
  .nav-links { grid-column: 4 / 10; display: flex; justify-content: center; gap: 32px; }
  .nav-links a {
    font-size: 13px; font-weight: 500; color: var(--text-muted);
    text-decoration: none; text-transform: lowercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text-dark); }
  .nav-right { grid-column: 10 / 13; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .nav-right a { font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-right a:hover { color: var(--text-dark); }
  .nav-cta {
    background: var(--text-dark); color: #fff; border: none; border-radius: 999px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-sans); transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 8px; }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-dark); margin: 5px 0; transition: all 0.3s; border-radius: 2px; }

  @media (max-width: 768px) {
    .nav-links, .nav-right a { display: none; }
    .hamburger { display: block; }
    .nav-inner { grid-template-columns: 1fr auto; }
    .nav-brand { grid-column: 1; }
    .nav-right { grid-column: 2; }
  }

  /* ── Mobile Drawer ─────────────────────── */
  .mobile-drawer {
    position: fixed; inset: 0; z-index: 49;
    background: rgba(237,238,245,0.97); backdrop-filter: blur(20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
  }
  .mobile-drawer.open { opacity: 1; pointer-events: auto; }
  .mobile-drawer a {
    font-family: var(--font-display); font-size: 36px; font-weight: 600;
    color: var(--text-dark); text-decoration: none;
    transform: translateY(20px); opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
  }
  .mobile-drawer.open a { transform: translateY(0); opacity: 1; }
  .mobile-drawer.open a:nth-child(1) { transition-delay: 0.05s; }
  .mobile-drawer.open a:nth-child(2) { transition-delay: 0.1s; }
  .mobile-drawer.open a:nth-child(3) { transition-delay: 0.15s; }
  .mobile-drawer.open a:nth-child(4) { transition-delay: 0.2s; }

  /* ── Hero ─────────────────────── */
  .hero {
    position: relative; width: 100%;
    min-height: 140vh; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; overflow: hidden;
  }
  .hero-video-wrap {
    position: absolute; top: 20vh; left: 0; width: 100%; height: 120vh;
    z-index: 0; pointer-events: none;
  }
  .hero-video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .hero-video-mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 128px;
    background: linear-gradient(to bottom, var(--bg), transparent);
  }

  .hero-content {
    max-width: 1280px; width: 100%; margin: 0 auto;
    padding: 180px 80px 0; position: relative; z-index: 10;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 32px;
  }
  .hero-text { grid-column: 2 / 12; }

  .hero-title {
    font-family: var(--font-display); font-size: clamp(40px, 6vw, 72px);
    font-weight: 600; line-height: 1.08; letter-spacing: -0.03em;
    margin-bottom: 32px;
  }
  .hero-title .muted { color: var(--text-muted); }
  .eye-pill {
    display: inline-flex; align-items: center; justify-content: center;
    width: 62px; height: 24px; border: 2px solid var(--text-dark);
    border-radius: 999px; vertical-align: middle; margin: 0 4px;
  }
  .eye-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dark); }

  .search-pill {
    display: inline-flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 6px;
    padding: 8px 8px 8px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    max-width: 420px; width: 100%;
  }
  .search-pill input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; font-family: var(--font-sans); color: var(--text-dark);
  }
  .search-pill input::placeholder { color: #bbb; }
  .search-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--text-dark); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.2s;
  }
  .search-btn:hover { transform: scale(1.05); }
  .search-btn svg { width: 16px; height: 16px; }

  /* Edge labels */
  .edge-label {
    position: fixed; font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.05em; z-index: 20;
  }
  .edge-lang {
    right: 24px; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.6); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.06);
    font-weight: 500; cursor: pointer; transition: background 0.2s;
  }
  .edge-lang:hover { background: rgba(255,255,255,0.9); }
  .edge-bottom-left { left: 24px; bottom: 24px; }
  .edge-bottom-right { right: 24px; bottom: 24px; }

  @media (max-width: 768px) {
    .hero-content { padding: 140px 24px 0; }
    .hero-text { grid-column: 1 / -1; }
    .eye-pill { width: 42px; height: 18px; }
    .eye-dot { width: 6px; height: 6px; }
    .edge-lang { display: none; }
    .edge-bottom-left, .edge-bottom-right { display: none; }
  }

  /* ── Entry Animations ─────────────────────── */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-in { animation: slideUp 0.8s cubic-bezier(0.16,1,0.3,1) both; }
  .anim-d1 { animation-delay: 0.15s; }
  .anim-d2 { animation-delay: 0.3s; }

  @media (prefers-reduced-motion: reduce) {
    .anim-in { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-brand">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M14 0C6.268 0 0 6.268 0 14s6.268 14 14 14 14-6.268 14-14S21.732 0 14 0zm0 4c5.523 0 10 4.477 10 10s-4.477 10-10 10S4 19.523 4 14 8.477 4 14 4z" fill="#1a1a1a"/>
        <path d="M14 7a7 7 0 100 14 7 7 0 000-14zm0 3a4 4 0 110 8 4 4 0 010-8z" fill="#1a1a1a"/>
      </svg>
      <span>mėntality</span>
    </div>
    <div class="nav-links">
      <a href="#">service</a>
      <a href="#">patient resources</a>
      <a href="#">about us</a>
      <a href="#">education center</a>
    </div>
    <div class="nav-right">
      <a href="#">find help</a>
      <button class="nav-cta">get started →</button>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-drawer" id="mobileDrawer">
  <a href="#">service</a>
  <a href="#">patient resources</a>
  <a href="#">about us</a>
  <a href="#">education center</a>
</div>

<span class="edge-label edge-lang">pl — en</span>
<span class="edge-label edge-bottom-left">2024</span>
<span class="edge-label edge-bottom-right">mental health tools</span>

<section class="hero">
  <div class="hero-video-wrap">
    <div class="hero-video-mask"></div>
    <video autoplay loop muted playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260603_132049_036591b8-6e92-4760-b94c-a7ea6eef315c.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title anim-in">
        <span style="color:var(--text-dark)">Remix: Mentality offers</span><br>
        <span class="muted">information</span><br>
        <span class="muted">and resources to help you manage</span><br>
        <span class="muted">your</span>
        <span class="eye-pill"><span class="eye-dot"></span></span>
        <span class="muted">mental wellbeing.</span>
      </h1>
      <div class="search-pill anim-in anim-d1">
        <input type="text" placeholder="Ask me anything..." />
        <button class="search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  const hamburger = document.getElementById('hamburgerBtn');
  const drawer = document.getElementById('mobileDrawer');
  let isOpen = false;

  hamburger.addEventListener('click', () => {
    isOpen = !isOpen;
    drawer.classList.toggle('open', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
    const spans = hamburger.querySelectorAll('span');
    if (isOpen) {
      spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
      spans[1].style.opacity = '0';
      spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
    } else {
      spans[0].style.transform = '';
      spans[1].style.opacity = '';
      spans[2].style.transform = '';
    }
  });

  drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    isOpen = false;
    drawer.classList.remove('open');
    document.body.style.overflow = '';
    const spans = hamburger.querySelectorAll('span');
    spans[0].style.transform = '';
    spans[1].style.opacity = '';
    spans[2].style.transform = '';
  }));
</script>
</body>
</html>
