<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daisy Wild — Fragrance product showcase</title>
<style>
  :root {
    --text: #000;
    --bg-lime: #bde84f;
    --placeholder: #d9d9d9;
    --video-bg: #111;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: #fff; }

  .section { position: relative; width: 100%; }
  .layout { display: flex; flex-direction: column-reverse; min-height: 100vh; }
  @media (min-width: 768px) { .layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; } }

  .video-desktop { display: none; position: relative; overflow: hidden; background: var(--video-bg); min-height: 100%; }
  .video-mobile { display: block; position: relative; overflow: hidden; background: var(--video-bg); height: 75vw; }
  @media (min-width: 768px) {
    .video-desktop { display: block; }
    .video-mobile { display: none; }
  }
  .video-desktop video, .video-mobile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .panel { position: relative; display: flex; flex-direction: column; padding: 24px 24px 32px; background: var(--bg-lime); min-height: 100%; }
  @media (min-width: 768px) { .panel { padding: 32px 32px 40px; } }

  .top-labels { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: auto; }
  .top-labels span { font-size: 12px; font-weight: 400; color: var(--text); }

  .image-block { display: flex; flex-direction: column; align-items: center; padding: 32px 0; flex: 1; justify-content: center; }
  .image-frame { width: clamp(140px, 40%, 220px); aspect-ratio: 220 / 340; background: var(--placeholder); border-radius: 2px; flex-shrink: 0; overflow: hidden; }
  .image-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .caption { text-align: center; margin-top: 16px; }
  .caption p { font-size: 14px; font-weight: 400; color: var(--text); }
  .caption .size { font-size: 12px; margin-top: 4px; }

  .bottom-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .notes { display: flex; flex-direction: column; gap: 2px; }
  .notes .label { font-size: 12px; line-height: 1.3; color: var(--text); font-weight: 700; }
  .notes .ingredient { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.3; color: var(--text); }

  .shop-btn { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--text); background: transparent; color: var(--text); padding: 12px 24px; position: relative; cursor: pointer; flex-shrink: 0; }
  .shop-btn span.txt { position: relative; z-index: 10; transition: color 500ms; }
  .shop-btn .fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: #fff; transition: transform 500ms ease-out; }
  .shop-btn:hover .fill { transform: scaleX(1); }
  .shop-btn:hover .txt { color: #000; }

  /* reveal animation */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 1600ms var(--ease), transform 1600ms var(--ease); }
  .reveal.in { opacity: 1; transform: translate(0, 0); }
  .r1 { --d: 0ms; } .r2 { --d: 300ms; } .r3 { --d: 600ms; } .r4 { --d: 900ms; } .r5 { --d: 1150ms; }
  .reveal { transition-delay: var(--d); }
  .r1 { transition-duration: 1400ms; transform: translateY(12px); }
  .r2 { transition-duration: 1800ms; transform: translateY(40px); }
  .r3 { transition-duration: 1400ms; transform: translateY(10px); }
  .r4 { transition-duration: 1400ms; transform: translateY(16px); }
  .r5 { transition-duration: 1400ms; transform: translateY(16px); }
</style>
</head>
<body>
<section class="section" id="sec">
  <div class="layout">
    <div class="video-desktop">
      <video autoplay muted loop playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260511_151818_65bb22c5-33ae-4e23-85ea-0a3dd89957c2.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="video-mobile">
      <video autoplay muted loop playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260511_151818_65bb22c5-33ae-4e23-85ea-0a3dd89957c2.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="panel">
      <div class="top-labels reveal r1">
        <span>Daisy wild</span>
        <span>Playful</span>
      </div>

      <div class="image-block reveal r2">
        <div class="image-frame">
          <img alt="Eau So Extra"
               src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260511_151621_4fba6892-ed21-4c2e-8cb3-0bd2ec2abefa.png&w=1280&q=85" />
        </div>
        <div class="caption reveal r3">
          <p>Eau So Extra</p>
          <p class="size">100 ml / 3.3 oz</p>
        </div>
      </div>

      <div class="bottom-row">
        <div class="notes reveal r4">
          <div><p class="label">Top</p><p class="ingredient">Banana Blossom Accord</p></div>
          <div><p class="label">Heart</p><p class="ingredient">Chocolate Daisy Accord</p></div>
          <div><p class="label">Base</p><p class="ingredient">Vetiver Oil</p></div>
        </div>

        <button class="shop-btn reveal r5">
          <span class="fill"></span>
          <span class="txt">Shop now</span>
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  const sec = document.getElementById('sec');
  const io = new IntersectionObserver(([e]) => {
    if (e.isIntersecting) {
      sec.querySelectorAll('.reveal').forEach(n => n.classList.add('in'));
      io.disconnect();
    }
  }, { threshold: 0.15 });
  io.observe(sec);
</script>
</body>
</html>
