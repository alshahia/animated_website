<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atelier — UX and APP DESIGN for BOLD VENTURES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow-x: hidden; background: #000; color: #fff; }
  body { font-family: Inter, sans-serif; }

  .font-instrument-serif { font-family: "Instrument Serif", serif; }

  /* ── Hero section ─────────────────────────── */
  .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .hero-content { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; }

  /* ── Navbar ─────────────────────────── */
  .navbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; }
  @media (min-width: 768px) { .navbar { padding: 24px 48px; } }
  @media (min-width: 1024px) { .navbar { padding: 24px 64px; } }
  .logo { font-family: Inter, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -0.02em; color: #fff; }
  .nav-links { display: none; gap: 28px; margin-left: 32px; flex: 1; }
  @media (min-width: 768px) { .nav-links { display: flex; } }
  .nav-links a { color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 300; text-decoration: none; transition: color 200ms; }
  .nav-links a:hover { color: #fff; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-reach { display: none; color: #fff; font-size: 14px; font-weight: 300; text-decoration: none; }
  @media (min-width: 768px) { .nav-reach { display: inline; } }
  .nav-talk { display: none; background: #fff; color: #000; border: none; border-radius: 999px; padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: Inter, sans-serif; }
  @media (min-width: 768px) { .nav-talk { display: inline-block; } }

  /* hamburger */
  .hamburger { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px; width: 28px; height: 28px; background: transparent; border: none; cursor: pointer; padding: 0; }
  @media (min-width: 768px) { .hamburger { display: none; } }
  .hamburger span { display: block; height: 2px; background: #fff; border-radius: 999px; transition: transform 500ms cubic-bezier(0.76, 0, 0.24, 1), opacity 300ms, width 500ms; }
  .hamburger span:nth-child(1) { width: 24px; }
  .hamburger span:nth-child(2) { width: 16px; }
  .hamburger span:nth-child(3) { width: 24px; }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── Hero body ─────────────────────────── */
  .hero-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px 24px 0; text-align: center; }
  @media (min-width: 640px) { .hero-body { padding: 24px 24px 0; } }
  @media (min-width: 768px) { .hero-body { padding: 32px 48px 0; } }
  @media (min-width: 1024px) { .hero-body { padding: 40px 64px 0; } }

  .hero-title { font-family: "Instrument Serif", serif; color: #fff; font-size: 30px; line-height: 1.1; max-width: 1024px; font-weight: 400; }
  @media (min-width: 640px) { .hero-title { font-size: 36px; } }
  @media (min-width: 768px) { .hero-title { font-size: 48px; } }
  @media (min-width: 1024px) { .hero-title { font-size: 60px; } }
  @media (min-width: 1280px) { .hero-title { font-size: 72px; } }
  .hero-title .it { font-style: italic; font-family: "Instrument Serif", serif; }

  .hero-sub { margin-top: 16px; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 300; max-width: 28rem; line-height: 1.6; }
  @media (min-width: 768px) { .hero-sub { margin-top: 20px; font-size: 16px; } }
  .hero-sub .break { display: none; }
  @media (min-width: 640px) { .hero-sub .break { display: inline; } }

  .hero-btns { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  @media (min-width: 640px) { .hero-btns { flex-direction: row; } }
  @media (min-width: 768px) { .hero-btns { margin-top: 24px; } }

  .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #000; border: none; border-radius: 999px; padding: 12px 28px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: Inter, sans-serif; }
  .btn-primary svg { width: 16px; height: 16px; transition: transform 300ms; }
  .btn-primary:hover svg { transform: translateX(4px); }

  .btn-secondary { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 12px 28px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: Inter, sans-serif; transition: background 200ms, border-color 200ms; }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.6); }
  .btn-secondary svg { width: 16px; height: 16px; }

  /* ── Mobile menu ─────────────────────────── */
  .menu-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 700ms; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  @media (min-width: 768px) { .menu-overlay { display: none; } }
  .menu-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; }
  .menu-links { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
  .menu-links a { font-family: "Instrument Serif", serif; color: #fff; font-size: 36px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 0; width: 100%; text-align: center; opacity: 0; transform: translateY(32px); transition: opacity 700ms cubic-bezier(0.76, 0, 0.24, 1), transform 700ms cubic-bezier(0.76, 0, 0.24, 1), padding 200ms; }
  @media (min-width: 640px) { .menu-links a { font-size: 48px; } }
  .menu-overlay.open .menu-links a { opacity: 1; transform: translateY(0); }
  .menu-overlay.open .menu-links a:hover { padding-left: 16px; }
  .menu-links a:nth-child(1) { transition-delay: 150ms; }
  .menu-links a:nth-child(2) { transition-delay: 230ms; }
  .menu-links a:nth-child(3) { transition-delay: 310ms; }
  .menu-links a:nth-child(4) { transition-delay: 390ms; }
  .menu-links a:nth-child(5) { transition-delay: 470ms; }
  .menu-footer { padding: 24px 24px 32px; opacity: 0; transition: opacity 700ms 550ms; }
  .menu-overlay.open .menu-footer { opacity: 1; }
  .menu-footer button { width: 100%; background: #fff; color: #000; border: none; border-radius: 999px; padding: 16px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: Inter, sans-serif; }

  .close-btn { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 28px; height: 28px; background: transparent; border: none; cursor: pointer; padding: 0; }
  .close-btn span { display: block; width: 24px; height: 2px; background: #fff; border-radius: 999px; }
  .close-btn span:nth-child(1) { transform: translateY(1px) rotate(45deg); }
  .close-btn span:nth-child(2) { transform: translateY(-1px) rotate(-45deg); }
</style>
</head>
<body>

<section class="hero">
  <video autoplay muted loop playsinline>
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204103_f607742e-09da-4cf5-bb06-4e67b0a531de.mp4" type="video/mp4" />
  </video>

  <div class="hero-content">
    <nav class="navbar">
      <div style="display: flex; align-items: center;">
        <div class="logo">Atelier</div>
        <div class="nav-links">
          <a href="#">Projects</a>
          <a href="#">Expertise</a>
          <a href="#">Studio</a>
          <a href="#">Insights</a>
        </div>
      </div>
      <div class="nav-right">
        <a href="#" class="nav-reach">Reach Out</a>
        <button class="nav-talk">Let's Talk</button>
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <div class="hero-body">
      <h1 class="hero-title">
        UX <span class="it">and</span> APP<br />
        DESIGN <span class="it">for</span> BOLD<br />
        VENTURES
      </h1>
      <p class="hero-sub">
        We shape digital products that define brands<span class="break"><br /></span>and unlock exponential growth.
      </p>
      <div class="hero-btns">
        <button class="btn-primary">
          See Cases
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
          Watch Reel
        </button>
      </div>
    </div>
  </div>
</section>

<div class="menu-overlay" id="menu">
  <div class="menu-header">
    <div class="logo">Atelier</div>
    <button class="close-btn" id="close" aria-label="Close menu">
      <span></span><span></span>
    </button>
  </div>
  <div class="menu-links">
    <a href="#">Projects</a>
    <a href="#">Expertise</a>
    <a href="#">Studio</a>
    <a href="#">Insights</a>
    <a href="#">Reach Out</a>
  </div>
  <div class="menu-footer">
    <button>Let's Talk</button>
  </div>
</div>

<script>
  const ham = document.getElementById('hamburger');
  const close = document.getElementById('close');
  const menu = document.getElementById('menu');
  ham.addEventListener('click', () => { menu.classList.add('open'); ham.classList.add('open'); });
  close.addEventListener('click', () => { menu.classList.remove('open'); ham.classList.remove('open'); });
  menu.querySelectorAll('.menu-links a').forEach(a => a.addEventListener('click', () => { menu.classList.remove('open'); ham.classList.remove('open'); }));
</script>
</body>
</html>
