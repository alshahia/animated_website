<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Foldcraft — Shaping visual narratives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-family: 'Geist', sans-serif; background: #000; overflow: hidden; }

  /* ── Root ─────────────────────────── */
  .app { position: relative; height: 100vh; width: 100%; overflow: hidden; background: #000; font-family: 'Geist', sans-serif; }
  .bg-video { position: absolute; inset: 0; }
  .bg-video video { width: 100%; height: 100%; object-fit: cover; object-position: 70% center; }

  /* ── Navbar ─────────────────────────── */
  .nav { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; }
  @media (min-width: 768px)  { .nav { padding: 20px 48px; } }
  @media (min-width: 1024px) { .nav { padding: 20px 64px; } }
  .nav-left { display: flex; align-items: center; gap: 40px; }
  .nav-logo { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  @media (min-width: 640px) { .nav-logo { font-size: 20px; } }
  .nav-links { display: none; gap: 32px; }
  @media (min-width: 768px) { .nav-links { display: flex; } }
  .nav-links a { color: rgba(255, 255, 255, 0.8); font-size: 14px; text-decoration: none; transition: color 200ms; }
  .nav-links a:hover { color: #fff; }

  .nav-cta { display: none; background: #fff; color: #000; border: none; border-radius: 8px; padding: 8px 20px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: transform 200ms; }
  .nav-cta:hover { transform: scale(1.05); }
  @media (min-width: 768px) { .nav-cta { display: inline-block; } }

  /* hamburger */
  .hamburger { position: relative; z-index: 50; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; cursor: pointer; transition: transform 200ms; }
  .hamburger:active { transform: scale(0.9); }
  @media (min-width: 768px) { .hamburger { display: none; } }
  .hb-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: transform 300ms, opacity 200ms, scale 200ms; }
  .hb-icon svg { width: 20px; height: 20px; }
  .hb-icon.menu { transform: rotate(0deg); opacity: 1; }
  .hb-icon.x { transform: rotate(-90deg); opacity: 0; scale: 0.8; }
  .hamburger.open .hb-icon.menu { transform: rotate(90deg); opacity: 0; }
  .hamburger.open .hb-icon.x { transform: rotate(0deg); opacity: 1; scale: 1; }

  /* mobile menu */
  .mmenu { position: absolute; inset-inline: 0; top: 0; left: 0; right: 0; z-index: 20; background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); height: 0; opacity: 0; pointer-events: none; overflow: hidden; transition: height 500ms cubic-bezier(0.16, 1, 0.3, 1), opacity 500ms cubic-bezier(0.16, 1, 0.3, 1); }
  .mmenu.open { height: 100vh; opacity: 1; pointer-events: auto; }
  .mmenu-inner { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 32px; }
  .mmenu-links { display: flex; flex-direction: column; gap: 16px; }
  .mmenu-links a { color: rgba(255, 255, 255, 0.9); font-size: 30px; font-weight: 500; text-decoration: none; opacity: 0; transform: translateY(32px); transition: opacity 500ms 100ms, transform 500ms 100ms, color 200ms; }
  .mmenu.open .mmenu-links a { opacity: 1; transform: translateY(0); }
  .mmenu-links a:hover { color: #fff; }
  .mmenu-btn { margin-top: 24px; background: #fff; color: #000; border: none; border-radius: 999px; padding: 14px 32px; font-size: 16px; font-weight: 500; font-family: inherit; align-self: flex-start; cursor: pointer; opacity: 0; transform: translateY(32px); transition: opacity 500ms 200ms, transform 500ms 200ms, scale 200ms; }
  .mmenu.open .mmenu-btn { opacity: 1; transform: translateY(0); }
  .mmenu-btn:hover { scale: 1.05; }

  /* ── Hero ─────────────────────────── */
  .hero { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; height: calc(100vh - 80px); padding: 48px 24px 40px; }
  @media (min-width: 640px)  { .hero { padding: 64px 24px 48px; } }
  @media (min-width: 768px)  { .hero { padding: 80px 48px 64px; } }
  @media (min-width: 1024px) { .hero { padding: 80px 64px 64px; } }

  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  .hero-badge { max-width: 48rem; color: rgba(255, 255, 255, 0.9); font-size: 12px; margin-bottom: 24px; animation: fadeSlideUp 0.8s ease 0.2s both; }
  @media (min-width: 640px) { .hero-badge { font-size: 14px; margin-bottom: 24px; } }

  .hero h1 { max-width: 48rem; color: #fff; font-size: 30px; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; animation: fadeSlideUp 0.8s ease 0.4s both; }
  @media (min-width: 640px)  { .hero h1 { font-size: 48px; } }
  @media (min-width: 768px)  { .hero h1 { font-size: 60px; } }
  @media (min-width: 1024px) { .hero h1 { font-size: 72px; } }

  .hero-bottom { display: flex; flex-direction: column; align-items: flex-start; }
  .hero-copy { max-width: 24rem; color: rgba(255, 255, 255, 0.6); font-size: 14px; line-height: 1.6; margin-bottom: 24px; animation: fadeSlideUp 0.8s ease 0.7s both; }
  @media (min-width: 640px)  { .hero-copy { max-width: 32rem; font-size: 16px; margin-bottom: 24px; } }
  @media (min-width: 768px)  { .hero-copy { font-size: 18px; margin-bottom: 24px; } }

  .hero-cta { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: transform 200ms; animation: fadeSlideUp 0.8s ease 0.9s both; }
  @media (min-width: 640px) { .hero-cta { padding: 12px 24px; } }
  .hero-cta:hover { transform: scale(1.05); }
  .hero-cta svg { width: 16px; height: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .hero-badge, .hero h1, .hero-copy, .hero-cta { animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="bg-video">
    <video autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4" type="video/mp4" />
    </video>
  </div>

  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">Foldcraft</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Studio</a>
        <a href="#">Reach Us</a>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <button class="nav-cta">Let's Talk</button>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span class="hb-icon menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="18" y2="18" /></svg></span>
        <span class="hb-icon x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></span>
      </button>
    </div>
  </nav>

  <div class="mmenu" id="mmenu">
    <div class="mmenu-inner">
      <div class="mmenu-links">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Studio</a>
        <a href="#">Reach Us</a>
      </div>
      <button class="mmenu-btn">Let's Talk</button>
    </div>
  </div>

  <header class="hero">
    <div>
      <p class="hero-badge">Brand &amp; Visual Storytelling</p>
      <h1>Shaping visual<br />narratives,<br />one pixel at a time.</h1>
    </div>
    <div class="hero-bottom">
      <p class="hero-copy">Turning vision into reality through craft, motion, and an endless pursuit of beauty.</p>
      <button class="hero-cta">
        Explore Work
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </button>
    </div>
  </header>
</div>

<script>
  const ham = document.getElementById('hamburger');
  const mmenu = document.getElementById('mmenu');
  const toggle = () => {
    const open = mmenu.classList.toggle('open');
    ham.classList.toggle('open', open);
  };
  ham.addEventListener('click', toggle);
  mmenu.querySelectorAll('a, button').forEach(el => el.addEventListener('click', () => {
    mmenu.classList.remove('open');
    ham.classList.remove('open');
  }));
</script>
</body>
</html>
